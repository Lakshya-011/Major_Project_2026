
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rescue Management | PawShield</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="./css/rescue-admin.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <i class="fa-solid fa-paw"></i> PawShield Admin
            </a>

            <div class="ms-auto d-flex gap-2">
                <a href="admin.html" class="btn btn-outline-light">Main Admin</a>
                <a href="dashboard.html" class="btn btn-outline-light">Dashboard</a>
                <button id="logoutBtn" class="btn btn-warning">Logout</button>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <div class="page-heading mb-4">
            <h1><i class="fa-solid fa-truck-medical text-danger"></i> Rescue Reports</h1>
            <p class="text-muted">Review reports and manage animal rescue operations.</p>
        </div>

        <div id="message" class="alert d-none" role="alert"></div>

        <div class="row g-3 mb-4">
            <div class="col-md-3">
                <div class="stat-card">
                    <h3 id="totalCount">0</h3>
                    <p>Total Reports</p>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card">
                    <h3 id="pendingCount">0</h3>
                    <p>Pending</p>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card">
                    <h3 id="progressCount">0</h3>
                    <p>In Progress</p>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card">
                    <h3 id="completedCount">0</h3>
                    <p>Completed</p>
                </div>
            </div>
        </div>

        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
            <h4 class="mb-0">All Reports</h4>
            <button id="refreshBtn" class="btn btn-success">
                <i class="fa-solid fa-rotate"></i> Refresh
            </button>
        </div>

        <div id="reportsContainer" class="row g-4">
            <div class="col-12 text-center">
                <div class="spinner-border text-success"></div>
                <p class="mt-2">Loading rescue reports...</p>
            </div>
        </div>
    </main>

    <footer class="text-center py-4 bg-dark text-white">
        <p class="mb-0">© 2026 PawShield. Every Life Matters.</p>
    </footer>

    <script src="./js/config.js"></script>
    <script src="./js/rescueAdmin.js"></script>
</body>
</html>
