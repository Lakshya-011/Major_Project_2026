
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Pet Details | PawShield
    </title>

    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Google Font -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- CSS -->

    <link
        rel="stylesheet"
        href="./css/pet.css">

</head>

<body>

    <!-- ================= Navbar ================= -->

    <nav
        class="navbar navbar-expand-lg navbar-dark bg-dark">

        <div class="container">

            <a
                href="index.html"
                class="navbar-brand fw-bold">

                <i class="fa-solid fa-paw"></i>

                PawShield

            </a>

            <button
                class="navbar-toggler"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">

                <span
                    class="navbar-toggler-icon">

                </span>

            </button>

            <div
                class="collapse navbar-collapse"
                id="navbarNav">

                <ul
                    class="navbar-nav ms-auto">

                    <li class="nav-item">

                        <a
                            href="pets.html"
                            class="nav-link">

                            Pets

                        </a>

                    </li>

                    <li class="nav-item">

                        <a
                            href="dashboard.html"
                            class="nav-link">

                            Dashboard

                        </a>

                    </li>

                    <li class="nav-item">

                        <button
                            id="logoutBtn"
                            class="btn btn-warning ms-3">

                            Logout

                        </button>

                    </li>

                </ul>

            </div>

        </div>

    </nav>

    <!-- ================= Pet Details ================= -->

    <section
        class="py-5">

        <div class="container">

            <div
                class="row g-5">

                <!-- Image -->

                <div
                    class="col-lg-6">

                    <img
                        id="petImage"
                        class="img-fluid rounded shadow">

                </div>

                <!-- Details -->

                <div
                    class="col-lg-6">

                    <h1
                        id="petName"
                        class="fw-bold mb-3">

                    </h1>

                    <div
                        id="petInfo">

                        <p>

                            <strong>Breed :</strong>

                            <span id="breed"></span>

                        </p>

                        <p>

                            <strong>Species :</strong>

                            <span id="species"></span>

                        </p>

                        <p>

                            <strong>Age :</strong>

                            <span id="age"></span>

                        </p>

                        <p>

                            <strong>Gender :</strong>

                            <span id="gender"></span>

                        </p>

                        <p>

                            <strong>Color :</strong>

                            <span id="color"></span>

                        </p>

                        <p>

                            <strong>Vaccinated :</strong>

                            <span id="vaccinated"></span>

                        </p>

                        <p>

                            <strong>Health :</strong>

                            <span id="health"></span>

                        </p>

                        <p>

                            <strong>Location :</strong>

                            <span id="location"></span>

                        </p>

                        <p>

                            <strong>Description :</strong>

                            <span id="description"></span>

                        </p>

                        <p>

                            <strong>Owner :</strong>

                            <span id="owner"></span>

                        </p>

                    </div>

                    <button
                        id="adoptBtn"
                        class="btn btn-success btn-lg mt-3">

                        <i class="fa-solid fa-heart"></i>

                        Adopt Now

                    </button>

                    <p
                        id="message"
                        class="mt-3">

                    </p>

                </div>

            </div>

        </div>

    </section>

    <!-- ================= Footer ================= -->

    <footer
        class="bg-dark text-white text-center py-4">

        <div class="container">

            <h5>

                <i class="fa-solid fa-paw"></i>

                PawShield

            </h5>

            <p class="mb-0">

                Give every pet a loving home ❤️

            </p>

        </div>

    </footer>

    <!-- Bootstrap -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Config -->

    <script src="./js/config.js"></script>

    <!-- JS -->

    <script src="./js/pet.js"></script>

</body>

</html>
