
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Edit Pet | PawShield</title>

    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Google Font -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- CSS -->

    <link
        rel="stylesheet"
        href="./css/create-pet.css">

</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

        <div class="container">

            <a
                href="index.html"
                class="navbar-brand fw-bold">

                <i class="fa-solid fa-paw"></i>

                PawShield

            </a>

            <button
                class="navbar-toggler"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div
                class="collapse navbar-collapse"
                id="navbarNav">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">

                        <a
                            href="dashboard.html"
                            class="nav-link">

                            Dashboard

                        </a>

                    </li>

                    <li class="nav-item">

                        <a
                            href="pets.html"
                            class="nav-link">

                            Pets

                        </a>

                    </li>

                    <li class="nav-item">

                        <button
                            id="logoutBtn"
                            class="btn btn-warning ms-3">

                            Logout

                        </button>

                    </li>

                </ul>

            </div>

        </div>

    </nav>

    <!-- ================= EDIT PET FORM ================= -->

    <section class="py-5">

        <div class="container">

            <div class="row justify-content-center">

                <div class="col-lg-8">

                    <div class="card shadow">

                        <div class="card-body p-5">

                            <h2 class="text-center mb-4">

                                <i class="fa-solid fa-pen-to-square"></i>

                                Edit Pet Details

                            </h2>

                            <!-- Existing Pet Image -->

                            <div class="text-center mb-4">

                                <img
                                    id="currentPetImage"
                                    src=""
                                    alt="Current Pet Image"
                                    class="img-fluid rounded shadow"
                                    style="max-height: 220px;">

                            </div>

                            <form
                                id="editPetForm"
                                enctype="multipart/form-data">

                                <div class="row">

                                    <div class="col-md-6 mb-3">

                                        <label class="form-label">

                                            Pet Name

                                        </label>

                                        <input
                                            type="text"
                                            id="petName"
                                            class="form-control"
                                            required>

                                    </div>

                                    <div class="col-md-6 mb-3">

                                        <label class="form-label">

                                            Species

                                        </label>

                                        <select
                                            id="species"
                                            class="form-select"
                                            required>

                                            <option value="">

                                                Select

                                            </option>

                                            <option value="Dog">

                                                Dog

                                            </option>

                                            <option value="Cat">

                                                Cat

                                            </option>

                                            <option value="Bird">

                                                Bird

                                            </option>

                                            <option value="Rabbit">

                                                Rabbit

                                            </option>

                                        </select>

                                    </div>

                                    <div class="col-md-6 mb-3">

                                        <label class="form-label">

                                            Breed

                                        </label>

                                        <input
                                            type="text"
                                            id="breed"
                                            class="form-control"
                                            required>

                                    </div>

                                    <div class="col-md-6 mb-3">

                                        <label class="form-label">

                                            Age

                                        </label>

                                        <input
                                            type="number"
                                            id="age"
                                            class="form-control"
                                            min="0"
                                            required>

                                    </div>

                                    <div class="col-md-6 mb-3">

                                        <label class="form-label">

                                            Gender

                                        </label>

                                        <select
                                            id="gender"
                                            class="form-select"
                                            required>

                                            <option value="">

                                                Select

                                            </option>

                                            <option value="Male">

                                                Male

                                            </option>

                                            <option value="Female">

                                                Female

                                            </option>

                                        </select>

                                    </div>

                                    <div class="col-md-6 mb-3">

                                        <label class="form-label">

                                            Color

                                        </label>

                                        <input
                                            type="text"
                                            id="color"
                                            class="form-control"
                                            required>

                                    </div>

                                    <div class="col-md-6 mb-3">

                                        <label class="form-label">

                                            Vaccinated

                                        </label>

                                        <select
                                            id="vaccinated"
                                            class="form-select"
                                            required>

                                            <option value="true">

                                                Yes

                                            </option>

                                            <option value="false">

                                                No

                                            </option>

                                        </select>

                                    </div>

                                    <div class="col-md-6 mb-3">

                                        <label class="form-label">

                                            Health

                                        </label>

                                        <input
                                            type="text"
                                            id="health"
                                            class="form-control"
                                            required>

                                    </div>

                                    <div class="col-12 mb-3">

                                        <label class="form-label">

                                            Description

                                        </label>

                                        <textarea
                                            id="description"
                                            rows="4"
                                            class="form-control"
                                            required></textarea>

                                    </div>

                                    <div class="col-md-6 mb-3">

                                        <label class="form-label">

                                            Location

                                        </label>

                                        <input
                                            type="text"
                                            id="location"
                                            class="form-control"
                                            required>

                                    </div>

                                    <div class="col-md-6 mb-4">

                                        <label class="form-label">

                                            Change Pet Image

                                        </label>

                                        <input
                                            type="file"
                                            id="image"
                                            class="form-control"
                                            accept="image/*">

                                        <small class="text-muted">

                                            Leave empty to keep the existing image.

                                        </small>

                                    </div>

                                </div>

                                <div class="text-center">

                                    <button
                                        type="submit"
                                        id="updateBtn"
                                        class="btn btn-success px-5">

                                        <i class="fa-solid fa-save"></i>

                                        Update Pet

                                    </button>

                                    <a
                                        href="dashboard.html"
                                        class="btn btn-secondary px-4 ms-2">

                                        Cancel

                                    </a>

                                </div>

                                <div
                                    id="message"
                                    class="text-center mt-4">

                                </div>

                            </form>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </section>

    <!-- ================= FOOTER ================= -->

    <footer class="bg-dark text-white text-center py-4">

        <div class="container">

            <h5>

                <i class="fa-solid fa-paw"></i>

                PawShield

            </h5>

            <p class="mb-0">

                Give every pet a loving home ❤️

            </p>

        </div>

    </footer>

    <!-- Bootstrap -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Config -->

    <script src="./js/config.js"></script>

    <!-- Edit Pet JS -->

    <script src="./js/editPet.js"></script>

</body>

</html>
